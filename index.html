<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carlinho Mathématiques</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #050507;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 20px;
            background-color: #0a0a0f;
            border-bottom: 2px solid #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            text-align: center;
        }
        h1 {
            color: #ffffff;
            text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff;
            font-size: 2.2rem;
            letter-spacing: 2px;
        }
        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            background-color: #111118;
        }
        nav button {
            padding: 10px 20px;
            background-color: #1a1a24;
            color: #00f0ff;
            border: 1px solid #00f0ff;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        nav button.active {
            background-color: #00f0ff;
            color: #000000;
            box-shadow: 0 0 10px #00f0ff;
        }
        main {
            flex: 1;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .module {
            display: none;
            width: 100%;
            max-width: 1100px;
            background-color: #0d0d14;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(176, 38, 255, 0.1);
            border: 1px solid #2a2a35;
        }
        .module.active {
            display: block;
        }
        input, select {
            padding: 10px;
            background-color: #1a1a24;
            color: #ffffff;
            border: 1px solid #00f0ff;
            border-radius: 4px;
            outline: none;
        }
        canvas {
            width: 100% !important;
            height: 380px !important;
            background-color: #050507;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <header>
        <h1>CARLINHO MATHÉMATIQUES</h1>
    </header>

    <nav>
        <button onclick="switchModule('functions')" id="btn-functions" class="active">Funções</button>
        <button onclick="switchModule('geometry')" id="btn-geometry">Geometria 3D</button>
        <button onclick="switchModule('hypercube')" id="btn-hypercube">Simulador 4D</button>
        <button onclick="switchModule('calculus')" id="btn-calculus">Cálculo</button>
        <button onclick="switchModule('stats')" id="btn-stats">Probabilidade</button>
    </nav>

    <main>
        <div id="functions" class="module active">
            <h2 style="color: #39ff14; margin-bottom: 15px;">Plotagem Polinomial</h2>
            <p style="color: #aaa; margin-bottom: 15px;">Digite a função f(x) utilizando a sintaxe do Math.js (ex: x^3 - 2*x + 1):</p>
            <div style="margin-bottom: 15px;">
                <input type="text" id="funcInput" value="x^3 - 4*x" style="width: 100%; font-size: 1.1rem;" oninput="updateFunctionPlot()">
            </div>
            <canvas id="functionCanvas"></canvas>
        </div>

        <div id="geometry" class="module">
            <h2 style="color: #b026ff; margin-bottom: 15px;">Laboratório Geométrico 3D</h2>
            <div style="margin-bottom: 15px;">
                <select id="geometryShape" onchange="changeGeometryShape()">
                    <option value="cube">Cubo</option>
                    <option value="sphere">Esfera</option>
                    <option value="pyramid">Pirâmide</option>
                </select>
            </div>
            <div id="geometryContainer" style="width: 100%; height: 380px; border-radius: 8px; overflow: hidden;"></div>
        </div>

        <div id="hypercube" class="module">
            <h2 style="color: #00f0ff; margin-bottom: 15px;">Projeção Hiperespacial 4D (Tesserato)</h2>
            <div style="display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap;">
                <div>
                    <label style="display: block; margin-bottom: 5px;">Rotação XW</label>
                    <input type="range" id="rotXW" min="0" max="6.28" step="0.01" value="0" style="accent-color: #00f0ff;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 5px;">Rotação YW</label>
                    <input type="range" id="rotYW" min="0" max="6.28" step="0.01" value="0" style="accent-color: #00f0ff;">
                </div>
            </div>
            <div id="hypercubeContainer" style="width: 100%; height: 380px; border-radius: 8px; overflow: hidden;"></div>
        </div>

        <div id="calculus" class="module">
            <h2 style="color: #ff2a2a; margin-bottom: 15px;">Motor de Derivadas e Integrais</h2>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px;">Função f(x):</label>
                <input type="text" id="calcInput" value="x^2" style="width: 100%; font-size: 1.1rem;" oninput="runCalculus()">
            </div>
            <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                <div>
                    <label style="display: block; color: #aaa; font-size: 0.9rem;">Limite a:</label>
                    <input type="number" id="limitA" value="0" oninput="runCalculus()" style="width: 100px;">
                </div>
                <div>
                    <label style="display: block; color: #aaa; font-size: 0.9rem;">Limite b:</label>
                    <input type="number" id="limitB" value="1" oninput="runCalculus()" style="width: 100px;">
                </div>
            </div>
            <div style="background-color: #1a1a24; padding: 20px; border-radius: 8px; border-left: 4px solid #ff2a2a;">
                <p id="derivResult" style="font-size: 1.1rem; margin-bottom: 10px;">Derivada f'(x): </p>
                <p id="integResult" style="font-size: 1.1rem;">Integral Definida: </p>
            </div>
        </div>

        <div id="stats" class="module">
            <h2 style="color: #ffff00; margin-bottom: 15px;">Simulador de Dados</h2>
            <div style="display: flex; gap: 15px; align-items: center; margin-bottom: 15px;">
                <div>
                    <label style="display: block; margin-bottom: 5px;">Quantidade de Lançamentos:</label>
                    <input type="number" id="rollCount" value="100" style="width: 120px;">
                </div>
                <button onclick="runStats()" style="padding: 10px 20px; background-color: #ffff00; color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; height: 42px; margin-top: 22px;">Simular</button>
            </div>
            <canvas id="statsCanvas"></canvas>
        </div>
    </main>

    <div vw class="enabled" style="position: fixed; right: 10px; top: 50%; z-index: 9999;">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');

        function switchModule(id) {
            const mods = document.querySelectorAll('.module');
            for (let i = 0; i < mods.length; i = i + 1) {
                mods[i].classList.remove('active');
            }
            const btns = document.querySelectorAll('nav button');
            for (let i = 0; i < btns.length; i = i + 1) {
                btns[i].classList.remove('active');
            }
            document.getElementById(id).classList.add('active');
            document.getElementById('btn-' + id).classList.add('active');
        }

        let functionChart = null;
        function initFunctionPlot() {
            const ctx = document.getElementById('functionCanvas').getContext('2d');
            functionChart = new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [{ label: 'f(x)', data: [], borderColor: '#39ff14', borderWidth: 2, pointRadius: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { color: '#222' } }, y: { grid: { color: '#222' } } } }
            });
            updateFunctionPlot();
        }

        function updateFunctionPlot() {
            const expr = document.getElementById('funcInput').value;
            const labels = [];
            const data = [];
            try {
                const compiled = math.compile(expr);
                for (let x = -10; x <= 10; x = x + 0.5) {
                    labels.push(x.toFixed(1));
                    data.push(compiled.evaluate({ x }));
                }
                functionChart.data.labels = labels;
                functionChart.data.datasets[0].data = data;
                functionChart.update();
            } catch (err) {}
        }

        let geomScene, geomRenderer, geomMesh;
        function initGeometry() {
            const container = document.getElementById('geometryContainer');
            const width = container.clientWidth;
            const height = 380;
            geomScene = new THREE.Scene();
            geomScene.background = new THREE.Color('#050507');
            const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
            camera.position.z = 4;
            geomRenderer = new THREE.WebGLRenderer({ antialias: true });
            geomRenderer.setSize(width, height);
            container.appendChild(geomRenderer.domElement);
            geomScene.add(new THREE.AmbientLight(0xffffff, 1));
            updateGeometryMesh('cube');
            animateGeometry();
        }

        function updateGeometryMesh(type) {
            if (geomMesh) geomScene.remove(geomMesh);
            let geom;
            if (type === 'cube') geom = new THREE.BoxGeometry(2, 2, 2);
            else if (type === 'sphere') geom = new THREE.SphereGeometry(1.5, 32, 32);
            else geom = new THREE.ConeGeometry(1.5, 2.5, 4);
            const mat = new THREE.MeshPhongMaterial({ color: 0xb026ff, wireframe: true });
            geomMesh = new THREE.Mesh(geom, mat);
            geomScene.add(geomMesh);
        }

        function changeGeometryShape() {
            const val = document.getElementById('geometryShape').value;
            updateGeometryMesh(val);
        }

        function animateGeometry() {
            requestAnimationFrame(animateGeometry);
            if (geomMesh) {
                geomMesh.rotation.x = geomMesh.rotation.x + 0.01;
                geomMesh.rotation.y = geomMesh.rotation.y + 0.01;
            }
            if (geomRenderer && geomScene) {
                geomRenderer.render(geomScene, document.querySelector('#geometryContainer canvas') ? geomRenderer.domElement : geomRenderer.domElement);
            }
        }

        let hyperScene, hyperRenderer, hyperLines;
        function initHypercube() {
            const container = document.getElementById('hypercubeContainer');
            const width = container.clientWidth;
            const height = 380;
            hyperScene = new THREE.Scene();
            hyperScene.background = new THREE.Color('#050507');
            const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
            camera.position.z = 3.5;
            hyperRenderer = new THREE.WebGLRenderer({ antialias: true });
            hyperRenderer.setSize(width, height);
            container.appendChild(hyperRenderer.domElement);

            const vertices = [];
            for (let i = 0; i < 16; i = i + 1) {
                vertices.push([(i & 1) ? 1 : -1, (i & 2) ? 1 : -1, (i & 4) ? 1 : -1, (i & 8) ? 1 : -1]);
            }
            const edges = [];
            for (let i = 0; i < 16; i = i + 1) {
                for (let j = i + 1; j < 16; j = j + 1) {
                    let diff = 0;
                    for (let k = 0; k < 4; k = k + 1) {
                        if (vertices[i][k] !== vertices[j][k]) diff = diff + 1;
                    }
                    if (diff === 1) edges.push([i, j]);
                }
            }

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(edges.length * 6);
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.LineBasicMaterial({ color: 0x00f0ff });
            hyperLines = new THREE.LineSegments(geometry, material);
            hyperScene.add(hyperLines);

            const animate4D = () => {
                requestAnimationFrame(animate4D);
                const rx = parseFloat(document.getElementById('rotXW').value);
                const ry = parseFloat(document.getElementById('rotYW').value);
                const cosX = Math.cos(rx), sinX = Math.sin(rx);
                const cosY = Math.cos(ry), sinY = Math.sin(ry);

                const projected = vertices.map(v => {
                    let x = v[0], y = v[1], z = v[2], w = v[3];
                    let nx = x * cosX - w * sinX;
                    let nw = x * sinX + w * cosX;
                    x = nx; w = nw;
                    let ny = y * cosY - w * sinY;
                    let nw2 = y * sinY + w * cosY;
                    y = ny; w = nw2;
                    let f = 1 / (2.5 - w);
                    return [x * f, y * f, z * f];
                });

                const pos = hyperLines.geometry.attributes.position.array;
                let idx = 0;
                for (let i = 0; i < edges.length; i = i + 1) {
                    let v1 = projected[edges[i][0]];
                    let v2 = projected[edges[i][1]];
                    pos[idx] = v1[0]; pos[idx+1] = v1[1]; pos[idx+2] = v1[2];
                    pos[idx+3] = v2[0]; pos[idx+4] = v2[1]; pos[idx+5] = v2[2];
                    idx = idx + 6;
                }
                hyperLines.geometry.attributes.position.needsUpdate = true;
                hyperLines.rotation.x = hyperLines.rotation.x + 0.005;
                hyperLines.rotation.y = hyperLines.rotation.y + 0.005;
                hyperRenderer.render(hyperScene, camera);
            };
            animate4D();
        }

        function runCalculus() {
            const expr = document.getElementById('calcInput').value;
            const a = parseFloat(document.getElementById('limitA').value) || 0;
            const b = parseFloat(document.getElementById('limitB').value) || 1;
            try {
                const der = math.derivative(expr, 'x').toString();
                document.getElementById('derivResult').innerText = "Derivada f'(x): " + der;

                const compiled = math.compile(expr);
                const f = (x) => compiled.evaluate({ x });
                const n = 1000;
                const h = (b - a) / n;
                let sum = f(a) + f(b);
                for (let i = 1; i < n; i = i + 1) {
                    let x = a + i * h;
                    sum = sum + f(x) * (i % 2 === 0 ? 2 : 4);
                }
                let integral = (sum * h / 3).toFixed(4);
                document.getElementById('integResult').innerText = "Integral Definida: " + integral;
            } catch (err) {
                document.getElementById('derivResult').innerText = "Derivada f'(x): Erro";
                document.getElementById('integResult').innerText = "Integral Definida: Erro";
            }
        }

        let statsChart = null;
        function initStats() {
            const ctx = document.getElementById('statsCanvas').getContext('2d');
            statsChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: ['Face 1', 'Face 2', 'Face 3', 'Face 4', 'Face 5', 'Face 6'], datasets: [{ label: 'Frequência', data: [0,0,0,0,0,0], backgroundColor: '#ffff00' }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { color: '#222' } }, y: { grid: { color: '#222' } } } }
            });
            runStats();
        }

        function runStats() {
            const count = parseInt(document.getElementById('rollCount').value) || 100;
            const counts = [0,0,0,0,0,0];
            for (let i = 0; i < count; i = i + 1) {
                let face = Math.floor(Math.random() * 6);
                counts[face] = counts[face] + 1;
            }
            statsChart.data.datasets[0].data = counts;
            statsChart.update();
        }

        window.onload = function() {
            initFunctionPlot();
            initGeometry();
            initHypercube();
            runCalculus();
            initStats();
        };
    </script>
</body>
</html>
